[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-3ds-router"
version = "1.0.0"
description = "Dynamic 3DS 2.3 & Delegated Authentication SCA Engine for Payment Gateways"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "AAH20 / Agentic-3DS-Router Contributors"}
]
keywords = ["3ds", "emvco", "sca", "psd3", "delegated-authentication", "fido2", "fintech", "payments"]

[project.scripts]
tds-router = "agentic_3ds_router.cli:main"
